[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "transnet"
version = "1.0.0"
description = "Neural scoring of candidate transcripts from RNA-seq splice graphs"
readme = "README.md"
requires-python = ">=3.12"
# Use environment.yml for the verified versions and external build tools.
dependencies = ["torch>=2.12,<2.13", "torch-geometric>=2.8.1,<2.9", "numpy", "pandas", "scikit-learn", "matplotlib"]

[project.scripts]
transnet = "transnet.cli:main"

[tool.setuptools]
packages = ["transnet"]

[tool.setuptools.package-data]
transnet = ["pretrained/*.pt"]
